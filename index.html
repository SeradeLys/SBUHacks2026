<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Wolfie Butler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: persistent left rail + fluid workspace (max 1440); planner splits 64/36 with a sticky nutrition ledger. Mobile: top bar + bottom tabs. */
:root{
  /* Design system. Level 0 page canvas, Level 1 content surfaces, Level 2 interactive/grouped, Level 3 overlays. */
  /* color: one brand red; warm neutrals; semantic colors kept separate from the accent */
  --brand:#990000; --brand-ink:#7A0000; --brand-text:#990000; --brand-tint:rgba(153,0,0,.07); --brand-tint-2:rgba(153,0,0,.12); --on-brand:#fff;
  --bg:#FBF9F8; --surface:#FFFFFF; --surface-2:#F6F1EE; --surface-3:#EFE7E3;
  --fg:#2B1D1A; --muted:#6B5650; --line:#EDE3DE; --line-2:#DFD1CA;
  --ok:#2F7A4B; --ok-tint:rgba(47,122,75,.1); --warn:#8A5A00; --warn-tint:rgba(200,140,0,.13); --err:#B42318; --err-tint:rgba(180,35,24,.07);
  --art-l1:96%; --art-l2:91%; --art-ink:rgba(43,29,26,.12);
  /* elevation */
  --e-1:0 1px 2px rgba(43,29,26,.05);
  --e-2:0 1px 2px rgba(43,29,26,.05),0 10px 24px -12px rgba(43,29,26,.22);
  --e-3:0 2px 6px rgba(43,29,26,.06),0 24px 48px -16px rgba(43,29,26,.30);
  --shadow:var(--e-2);
  /* type */
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* shape */
  --r-sm:10px; --r:16px; --r-lg:24px; --r-xl:32px; --rail:76px; --rail-x:248px;
  /* motion */
  --t-fast:120ms; --t:200ms; --t-slow:320ms; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.15;color:var(--fg)}
h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.025em} h2{font-size:clamp(19px,2vw,22px)} h3{font-size:16.5px}
p{margin:0}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--surface);width:var(--rail);justify-self:start;z-index:40;overflow:hidden;white-space:nowrap;transition:width .24s var(--ease),box-shadow .24s var(--ease)}
/* Collapsed to an icon rail by default; .open (hover, focus, or a short grace period) widens it over the content. */
.rail.open{width:var(--rail-x);box-shadow:var(--e-3)}
.rail :is(.eyebrow,.lbl-t,.brand b,.count,.cloud span){transition:opacity .18s var(--ease)}
.rail:not(.open) :is(.eyebrow,.lbl-t,.brand b,.count,.cloud span){opacity:0}
.rail .cloud{transition:padding .24s var(--ease)}
.rail:not(.open) .cloud{padding-inline:20px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 7px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand-tint);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.link-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface-2)}
.link-code{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:.18em;color:var(--brand-text)}
/* iMessage Sync card (Profile page) */
.sync-card{display:flex;flex-direction:column;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sync-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sync-ico{width:36px;height:36px;border-radius:10px;background:var(--brand-tint);color:var(--brand-text);display:grid;place-items:center;flex:none}
.sync-ico svg{width:19px;height:19px}
.sync-title{flex:1 1 200px;min-width:0}
.sync-title h2{font-size:17px}
.sync-title p{color:var(--muted);font-size:13px;margin-top:2px}
.sync-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;margin-left:auto}
.sync-status.ok{background:var(--ok-tint);color:var(--ok)} .sync-status.warn{background:var(--warn-tint);color:var(--warn)}
.sync-body{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sync-num{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.iconbtn.sync-pen{width:34px;height:34px;border-color:transparent;background:transparent;color:var(--muted)}
.iconbtn.sync-pen:hover{background:var(--surface-2);color:var(--fg)}
.sync-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync-edit{flex:1 1 100%}
.sync-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sync-flow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg);opacity:.55}
.sync-flow span{padding:3px 9px;border-radius:99px;background:var(--surface-2)}
.sync-flow svg{width:16px;height:16px;color:var(--muted)}
.sync-card.live .sync-flow{opacity:1}
.sync-card.live .sync-flow svg{color:var(--ok)}
/* the mascot PNG has transparent margins, so it is enlarged slightly inside circular and rounded frames */
img.mascot{transform:scale(1.3);transform-origin:50% 53%}
.brand b{font-family:var(--f-display);font-size:18px;white-space:nowrap;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:0 10px 6px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:10px 14.5px;border-radius:var(--r-sm);text-decoration:none;color:var(--fg);font-weight:500;min-height:42px;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.nav a svg{width:19px;height:19px;color:var(--muted);flex:none}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-tint);font-weight:700;color:var(--brand-text)}
.nav a[aria-current="page"] svg{color:var(--brand-text)}
.nav .count{margin-left:auto;font-size:12px;background:var(--brand);color:var(--on-brand);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.cloud{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:var(--r-sm)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)}
.main{min-width:0;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(0px,2vw,24px);display:flex;flex-direction:column;gap:28px}
.topbar,.tabbar{display:none}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .lead{color:var(--muted);margin-top:6px;max-width:60ch;font-size:15.5px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:var(--e-1)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);box-shadow:var(--e-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn.danger{color:var(--err);border-color:var(--line-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;transition:background var(--t-fast) var(--ease)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600}
.input,select.input,textarea.input{min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);width:100%;min-width:0;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.input:hover{border-color:#CDBDB5}
textarea.input{min-height:120px;resize:vertical;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint-2)}
.input.bad{border-color:var(--err)}
.err{color:var(--err);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.unit-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;min-height:38px;color:var(--muted);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-text);box-shadow:var(--e-1),inset 0 0 0 1px var(--line-2)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:500;cursor:pointer;min-height:36px;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--brand-tint);color:var(--brand-text);border-color:var(--brand);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.chip.allergy[aria-pressed="true"]{background:var(--err);border-color:var(--err);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--fg);font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-tint);color:var(--ok)} .tag.warn{background:var(--warn-tint);color:var(--warn)} .tag.allergen{background:var(--err-tint);color:var(--err)}
.tag.brand{background:var(--brand-tint);color:var(--brand-text)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-tint);color:var(--fg);font-size:14px}
.notice svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:2px}
.notice.info{background:var(--surface-2)} .notice.info svg{color:var(--muted)}
.notice.danger{background:var(--err-tint)} .notice.danger svg{color:var(--err)}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--fg)}

/* hall cards */
.hall{position:relative;display:flex;flex-direction:column;gap:14px;padding:0;overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e-1);transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t) var(--ease)}
.hall:hover{border-color:var(--line-2);box-shadow:var(--e-2);transform:translateY(-2px)}
.hall .art{height:120px;border-radius:0}
.hall .body{padding:0 20px 20px;display:flex;flex-direction:column;gap:8px}
.hall .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.art{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,10) 40% var(--art-l1)),hsl(calc(var(--h,10) + 34) 36% var(--art-l2)));border-radius:12px}
.photo{position:relative;overflow:hidden;background:var(--surface-2)}
.photo img,.photo svg{display:block;width:100%;height:100%;object-fit:cover}
.thumb{height:140px;border-radius:12px}
.art .glyph{position:absolute;right:-6px;bottom:-22px;font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--art-ink);letter-spacing:-.04em;pointer-events:none}
.art .plate{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:62px;height:62px;border-radius:50%;border:2px solid var(--art-ink);box-shadow:inset 0 0 0 9px var(--art-ink)}

/* stat cards (profile estimates) */
.metric{display:flex;flex-direction:column;gap:6px}
.metric .v{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.metric .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.metric .na{color:var(--muted)}

/* food cards */
.menu-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.food{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
.food-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.food-head h3{min-width:0;padding-top:6px}
.food .station-tag{font-size:12px;color:var(--muted);margin-top:-6px}
.food h3{font-size:16px;cursor:pointer;text-decoration:underline transparent;text-underline-offset:3px;transition:text-decoration-color var(--t-fast) var(--ease)}
.food h3:hover{text-decoration-color:currentColor}
.food .desc{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.food .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.food .kcal{font-weight:600}
.food .acts{display:flex;gap:8px}
.food .acts .btn{flex:1}
.station-head{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-top:8px}
.station-head h2{font-size:18px}
.side-panel{position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--e-1)}
.mini-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.mini-item{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.mini-item span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* planner */
.planner{display:grid;grid-template-columns:minmax(0,64fr) minmax(0,36fr);gap:24px;align-items:start}
.ctx{display:flex;gap:8px 20px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}
.ctx b{font-weight:600}
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.prow:first-child{padding-top:4px}
.prow .nm{font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.prow .nm:hover{text-decoration:underline}
.prow .sub{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:var(--surface);cursor:pointer;font-size:18px}
.stepper button:hover{background:var(--surface-2)}
.stepper output{min-width:30px;text-align:center;font-weight:600}
.ledger{position:sticky;top:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--e-1)}
.ledger .big{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.nrow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.nrow:last-child{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);border-radius:99px}
.bar b{position:absolute;top:0;bottom:0;background:var(--line-2)}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.prog .t{display:flex;justify-content:space-between;gap:8px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.rec{display:flex;flex-direction:column;gap:12px}
.rec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rec li{display:flex;justify-content:space-between;gap:8px}
.why{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* recipes */
.feature{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden;border-radius:var(--r-lg)}
.feature .art{border-radius:0;min-height:260px}
.feature .body{padding:28px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.rcard{display:flex;flex-direction:column;gap:10px;padding:12px;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rcard{transition:box-shadow var(--t) var(--ease),transform var(--t) var(--ease),border-color var(--t) var(--ease)}
.rcard:hover{box-shadow:var(--e-2);transform:translateY(-2px);border-color:var(--line-2)}
.rcard .art{height:140px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.ing{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* recipe galleries: independent horizontal scrollers with edge fades and arrows as scroll cues */
.rsec{display:flex;flex-direction:column;gap:14px;min-width:0}
.rsec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rsec-head p{color:var(--muted);font-size:14.5px;margin-top:4px}
.rsec-acts{display:flex;align-items:center;gap:8px}
.rscroll{position:relative;min-width:0}
.rscroll::before,.rscroll::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:2;pointer-events:none;opacity:0;transition:opacity var(--t) var(--ease)}
.rscroll::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.rscroll::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.rscroll.can-l::before,.rscroll.can-r::after{opacity:1}

  <header class="topbar"><span class="logo" aria-hidden="true"><img class="mascot" src="assets/wolfie-mascot.png" alt=""></span><b>Wolfie Butler</b><a class="iconbtn" href="#profile" aria-label="Profile and targets" data-act="go" data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a></header>

</div>

<script>
/* =========================================================================
   Wolfie Butler — single-file build.
   Layers (top to bottom): CONFIG · NutritionService · MenuProvider (Nutrislice)
   · MealPlanService · RecommendationService · RecipeService
   · AgentService + PhotonBridge · Persistence (cloud db with device fallback)
   · UI. UI code only calls the services; it never re-implements a formula.
   ========================================================================= */

const CONFIG = {
  halls: {
    west: { id:"west", name:"West Side Dining", short:"West", slug:"west-side-dining", menuType:"todays-dine-in-specials-wsd", hue:8,
          },
    east: { id:"east", name:"East Side Dining", short:"East", slug:"east-side-dining", menuType:"todays-dine-in-specials-esd", hue:28,
          }
  },
  activity: {
    sedentary: { label:"Sedentary", desc:"Little to no exercise", mult:1.2, protein:[1.0,1.2] },
    light:     { label:"Lightly active", desc:"Light exercise or sports 1–3 days a week", mult:1.375, protein:[1.0,1.2] },
    moderate:  { label:"Moderately active", desc:"Moderate exercise or sports 3–5 days a week", mult:1.55, protein:[1.4,2.2] },
    very:      { label:"Very active", desc:"Hard exercise or sports 6–7 days a week", mult:1.725, protein:[1.4,2.2] },
    super:     { label:"Super active", desc:"Very hard exercise, physical work, or intensive training", mult:1.9, protein:[1.4,2.2] }
  },
  // Replace these with your own image paths (an uploaded asset path like "/_blob/<id>", or a data: URI).
  // Leave empty to show the built-in illustration. Developers update these paths directly in code.
  hallImages: { west: "assets/west-side-dining-hall.jpg", east: "assets/east-side-dining-hall.jpg" },
  // Chatbot icon: replace with your own image path (an uploaded asset "/_blob/<id>" or a data: URI). Empty = placeholder image.
  chatIcon: "assets/wolfie-mascot.png",
  dayShares: { Breakfast: 0.25, Lunch: 0.35, Dinner: 0.40 },
  calTolerance: 50,
  carbPct: [0.45, 0.65],
  fatPerKg: 1.0,
  adultMinAge: 18,
  // Dietary Reference Intakes, Adequate Intake for total fiber (Institute of Medicine, 2005).
  fiberRef: { source:"Institute of Medicine, Dietary Reference Intakes (2005), Adequate Intake for total fiber",
    table: [ {sex:"male",min:19,max:50,g:38},{sex:"male",min:51,max:200,g:30},{sex:"female",min:19,max:50,g:25},{sex:"female",min:51,max:200,g:21},
             {sex:"male",min:18,max:18,g:38},{sex:"female",min:18,max:18,g:26} ] },
  safety: { maxLossKgWeek:0.9, maxLossPctWeek:1, maxGainKgWeek:0.5, maxTotalPct:10, longWeeks:20, minTargetBmi:18.5 },
  healthResources: [
    { name:"Stony Brook Student Health Services", url:"https://www.stonybrook.edu/commcms/studenthealth/", kind:"Campus health service" },
    { name:"Find a registered dietitian (Academy of Nutrition and Dietetics)", url:"https://www.eatright.org/find-a-nutrition-expert", kind:"Registered dietitian" },
    { name:"Nutrition.gov", url:"https://www.nutrition.gov/", kind:"General health information" }
  ],
  dietOptions: ["Vegetarian","Vegan","Halal","Gluten free","Dairy free","High protein","Low sodium"],
  hardDiet: ["Vegetarian","Vegan","Halal"],
  allergyOptions: ["Milk","Egg","Wheat","Soy","Peanut","Tree nut","Fish","Shellfish","Sesame"],
  safetyWarning: "Your requested goal may not be appropriate for your individual needs. We cannot safely generate this plan automatically. Please consult a qualified healthcare professional or registered dietitian for personalized guidance."
};

/* ---------------- NutritionService ---------------- */
const NutritionService = (() => {
  const isNum = v => v !== null && v !== undefined && v !== "" && Number.isFinite(Number(v));
  function normalize(p){
    const w = isNum(p.weight) ? Number(p.weight) : null, h = isNum(p.height) ? Number(p.height) : null;
    return { weightKg: w === null ? null : (p.weightUnit === "lb" ? w / 2.20462 : w),
             heightCm: h === null ? null : (p.heightUnit === "in" ? h * 2.54 : h),
             age: isNum(p.age) ? Number(p.age) : null };
  }
  function validate(p){
    const errors = {}, missing = [];
    const n = normalize(p);
    if (!isNum(p.age)) missing.push("age"); else if (!Number.isInteger(Number(p.age)) || p.age < 1 || p.age > 120) errors.age = "Enter your age as a whole number between 1 and 120.";
    if (!isNum(p.weight)) missing.push("weight"); else if (Number(p.weight) <= 0) errors.weight = "Weight must be greater than zero.";
      else if (n.weightKg < 25 || n.weightKg > 350) errors.weight = "That weight looks unusual. Check the number and the unit.";
    if (!isNum(p.height)) missing.push("height"); else if (Number(p.height) <= 0) errors.height = "Height must be greater than zero.";
      else if (n.heightCm < 100 || n.heightCm > 250) errors.height = "That height looks unusual. Check the number and the unit (inches, not feet).";
    if (!p.sex) missing.push("gender");
    if (!p.activity) missing.push("activity level"); else if (!CONFIG.activity[p.activity]) errors.activity = "Pick one of the listed activity levels.";
    if (String(p.phone ?? "").trim() && !normalizePhone(p.phone)) errors.phone = "Enter your phone number with its country code, like +1 555 123 4567.";   // the phone is optional; only a filled-in one is checked
    return { errors, missing, ok: !Object.keys(errors).length };
  }
  function fiberFor(sex, age){
    const row = CONFIG.fiberRef.table.find(r => r.sex === sex && age >= r.min && age <= r.max);
    return row ? row.g : null;
  }
  function calculateEstimates(p){
    const out = { status:"unavailable", bmrKcal:null, tdeeKcal:null, proteinGrams:{min:null,max:null}, carbohydrateGrams:{min:null,max:null},
      fatGrams:null, fiberGrams:null, warnings:[], missingInputs:[], limitations:[], meta:{} };
    out.limitations.push("These are estimates from general equations, not medical advice, a diagnosis or treatment.");
    if (!p) { out.missingInputs = ["age","weight","height","gender","activity level"]; return out; }
    const v = validate(p);
    out.missingInputs = v.missing;
    if (!v.ok) { out.warnings.push(...Object.values(v.errors)); return out; }
    if (v.missing.length) return out;
    const n = normalize(p), act = CONFIG.activity[p.activity];
    out.meta = { weightKg:n.weightKg, heightCm:n.heightCm, multiplier:act.mult, activity:act.label, equation:null, fiberSource:CONFIG.fiberRef.source };
    if (n.age < CONFIG.adultMinAge) {
      out.status = "restricted";
      out.warnings.push("Wolfie Butler's equations are built for adults. Because you may still be growing, we don't calculate personal targets. A doctor or registered dietitian can give you guidance that fits.");
      return out;
    }
    if (p.sex === "male" || p.sex === "female") {
      out.meta.equation = "Mifflin–St Jeor (" + p.sex + ")";
      out.bmrKcal = 10*n.weightKg + 6.25*n.heightCm - 5*n.age + (p.sex === "male" ? 5 : -161);
      out.tdeeKcal = out.bmrKcal * act.mult;
      out.carbohydrateGrams = { min: out.tdeeKcal*CONFIG.carbPct[0]/4, max: out.tdeeKcal*CONFIG.carbPct[1]/4 };
      out.fiberGrams = fiberFor(p.sex, n.age);
    } else {
      out.limitations.push("Energy, carbohydrate and fiber estimates use separate male and female equations, so they aren't available without a gender. You can enter your own targets instead.");
    }
    out.proteinGrams = { min: n.weightKg*act.protein[0], max: n.weightKg*act.protein[1] };
    out.fatGrams = n.weightKg * CONFIG.fatPerKg;
    out.limitations.push(`Protein uses ${act.protein[0]}–${act.protein[1]} g per kg for your activity level; these multipliers are configurable and need professional review before individual use.`);
    out.limitations.push("Fat uses a provisional 1 g per kg rule. It is a prototype setting, not a clinical recommendation.");
    out.limitations.push("Carbohydrates use 45–65% of estimated daily energy at 4 kcal per gram.");
    out.status = out.bmrKcal === null ? "partial" : "available";
    return out;
  }
  const NUTRIENTS = ["cal","protein","carbs","fat","fiber","sugar","sodium"];
  function calculateMealNutrition(items){
    const totals = {}, missing = {};
    NUTRIENTS.forEach(k => { totals[k] = 0; missing[k] = 0; });
    items.forEach(it => NUTRIENTS.forEach(k => { const v = it.nutr ? it.nutr[k] : null; if (isNum(v)) totals[k] += Number(v)*it.servings; else missing[k]++; }));
    NUTRIENTS.forEach(k => { if (missing[k] || !items.length) totals[k] = null; });
    return { totals, missing, count: items.length, servings: items.reduce((a,b)=>a+b.servings,0), complete: NUTRIENTS.slice(0,5).every(k=>!missing[k]) };
  }
  function evaluateGoalSafety(p, est){
    if (!p) return { status:"none" };
    if (p.rapidChange) return { status:"medical", message:"You mentioned an unexpected or rapid change in weight. Please talk with a doctor or campus health service before changing how you eat.", reasons:[] };
    const hasT = isNum(p.targetWeight), hasW = isNum(p.timeframeWeeks);
    const wantsChange = p.goal === "lose" || p.goal === "gain" || hasT || hasW;
    if (!wantsChange) return { status:"none" };
    if (est.status === "restricted") return { status:"restricted", message: CONFIG.safetyWarning, reasons:["Weight-change goals aren't checked for people who may still be growing."] };
    if (!est.meta.weightKg || !est.meta.heightCm) return { status:"unavailable", message:"Enter your current weight and height first so the goal can be checked." };
    if (!hasT || !hasW) return { status:"unavailable", message:"Add both a target weight and a timeframe to check this goal. Wolfie Butler never builds a weight plan without a safety check." };
    const weeks = Number(p.timeframeWeeks), tgt = Number(p.targetWeight);
    if (weeks <= 0 || tgt <= 0) return { status:"invalid", message:"Target weight and timeframe must both be greater than zero." };
    const lbUnit = p.weightUnit === "lb", tgtKg = lbUnit ? tgt/2.20462 : tgt, cur = est.meta.weightKg;
    const change = tgtKg - cur, abs = Math.abs(change);
    if (abs < 0.5) return { status:"ok", reasons:[], message:"Your target is close to your current weight. Wolfie Butler shows maintenance estimates." };
    const rate = abs / weeks, pctWeek = rate / cur * 100, pctTotal = abs / cur * 100;
    const tgtBmi = tgtKg / Math.pow(est.meta.heightCm/100, 2);
    const u = v => lbUnit ? `${fmt(v*2.20462,1)} lb` : `${fmt(v,1)} kg`;
    const reasons = [];
    if ((p.goal === "lose" && change > 0) || (p.goal === "gain" && change < 0)) reasons.push(`Your target weight goes the opposite way from your goal (${p.goal === "lose" ? "lose" : "gain"} weight). Check the numbers.`);
    if (change < 0 && (rate > CONFIG.safety.maxLossKgWeek || pctWeek > CONFIG.safety.maxLossPctWeek)) reasons.push(`This means losing about ${u(rate)} per week. Gradual guidance is usually no more than ${u(CONFIG.safety.maxLossKgWeek)} or about 1% of body weight per week.`);
    if (change > 0 && rate > CONFIG.safety.maxGainKgWeek) reasons.push(`This means gaining about ${u(rate)} per week, faster than the gradual ${u(CONFIG.safety.maxGainKgWeek)} per week usually suggested.`);
    if (pctTotal > CONFIG.safety.maxTotalPct && weeks < CONFIG.safety.longWeeks) reasons.push(`That's a change of ${fmt(pctTotal)}% of your body weight in ${fmt(weeks)} weeks.`);
    if (change < 0 && tgtBmi < CONFIG.safety.minTargetBmi) reasons.push("The target is below the usual healthy weight range for your height.");
    if (weeks < 2) reasons.push("The timeframe is very short for a body-weight change.");
    if (reasons.length) return { status:"restricted", message: CONFIG.safetyWarning, reasons, rate };
    return { status:"ok", reasons:[], rate, message:`Your goal works out to about ${u(rate)} per week, a gradual pace. Wolfie Butler still shows maintenance estimates only; a registered dietitian can help you plan around your goal.` };
  }
  return { normalize, validate, calculateEstimates, calculateMealNutrition, evaluateGoalSafety, isNum };
})();

/* ---------------- MenuProvider: Nutrislice parser ---------------- */
const MenuProvider = (() => {
  const ALLERGEN = /\b(milk|dairy|eggs?|wheat|gluten|soy|soybeans?|peanuts?|tree ?nuts?|nuts?|fish|shellfish|crustacean|sesame|mustard|sulfites?|coconut)\b/i;
  const FREE = /\b(free|friendly|without|no|avoid|avoiding)\b/i;
  const num = v => (v === null || v === undefined || v === "" || !Number.isFinite(Number(v))) ? null : Number(v);
  const clean = s => String(s || "").replace(/\s+/g," ").trim();
  function parse(raw, hallId){
    let data;
    try { data = typeof raw === "string" ? JSON.parse(raw.trim()) : raw; } catch(e){ throw new Error("That text isn't valid JSON. Copy the whole page from the API link (select all, then copy) and paste it again."); }
    let days = Array.isArray(data?.days) ? data.days : (Array.isArray(data?.menu_items) ? [{ date:data.date, menu_items:data.menu_items }] : null);
    if (!days) throw new Error("This doesn't look like a Nutrislice menu. The JSON should have a \"days\" list.");
    const out = [];
    for (const day of days) {
      if (!day || !/^\d{4}-\d{2}-\d{2}$/.test(day.date || "")) continue;
      let station = "Specials"; const seen = new Set(); const items = [];
      for (const mi of (day.menu_items || [])) {
        if (mi.is_section_title || mi.is_station_header || (!mi.food && mi.text)) { if (clean(mi.text)) station = clean(mi.text); continue; }
        const f = mi.food; if (!f || !f.name) continue;
        const id = String(f.id ?? mi.id ?? clean(f.name).toLowerCase().replace(/[^a-z0-9]+/g,"-"));
        if (seen.has(id + station)) continue; seen.add(id + station);
        const n = f.rounded_nutrition_info || f.nutrition_info || {};
        const hasN = f.has_nutrition_info !== false;
        const g = k => hasN ? num(n[k]) : null;
        const icons = Array.isArray(f.icons?.food_icons) ? f.icons.food_icons : (Array.isArray(f.icons) ? f.icons : []);
        const labels = [], allergens = [];
        icons.forEach(ic => { const nm = clean(ic?.name || ic?.synced_name || ic?.help_text); if (!nm) return;
          const isAllergen = ic.food_icon_group === 1261 || /^contains\s/i.test(nm) || (ALLERGEN.test(nm) && !FREE.test(nm));
          (isAllergen ? allergens : labels).push(nm.replace(/^contains\s+/i,"")); });
        const ss = f.serving_size_info || {};
        const serving = clean([ss.serving_size_amount, ss.serving_size_unit].filter(x => x !== null && x !== undefined && x !== "").join(" ")) || null;
        items.push({ id, name: clean(f.name), desc: clean(f.description), station: clean(mi.station_name || station) || station,
          serving, category: f.food_category ? clean(f.food_category) : null,
          nutr: { cal:g("calories"), protein:g("g_protein"), carbs:g("g_carbs"), fat:g("g_fat"), fiber:g("g_fiber"), sugar:g("g_sugar"), sodium:g("mg_sodium") },
          labels:[...new Set(labels)], allergens:[...new Set(allergens)], allergenInfo: allergens.length > 0 });
      }
      if (items.length) out.push({ hall: hallId, date: day.date, items });
    }
    if (!out.length) throw new Error("No dishes were found in this JSON. The menu may not be published yet for these dates.");
    return out;
  }
  return { parse };
})();

/* ---------------- MealPlanService ---------------- */
const MealPlanService = {
  key: (hall, date, foodId, period) => `${hall}|${date}|${foodId}|${period}`,
  add(plan, food, hall, date, servings=1, period="Lunch"){
    const k = this.key(hall, date, food.id, period); const ex = plan.items.find(i => i.key === k);
    if (ex) ex.servings += servings;
    else plan.items.push({ key:k, hall, date, period, foodId:food.id, name:food.name, serving:food.serving, station:food.station, nutr:{...food.nutr}, servings, labels:food.labels, allergens:food.allergens, allergenInfo:food.allergenInfo });
    return plan;
  },
  setServings(plan, key, n){ const it = plan.items.find(i => i.key === key); if (it) it.servings = Math.max(1, Math.round(n)); return plan; },
  remove(plan, key){ plan.items = plan.items.filter(i => i.key !== key); return plan; },
  availability(item, ctx){ return item.hall === ctx.hall && item.date === ctx.date ? "confirmed" : "other"; }
};

/* ---------------- RecommendationService ---------------- */
const periodOf = st => /breakfast|morning|pancake|omelet|cereal/i.test(st) ? "Breakfast" : /lunch/i.test(st) ? "Lunch" : /dinner|late night/i.test(st) ? "Dinner" : "All day";
const PERIODS = ["Breakfast","Lunch","Dinner"];
const CONDIMENT = /dressing|topping|seed stack|add-in|condiment|sauce bar/i;
const RecommendationService = {
  generate({ menu, profile, targets, period="Any" }){
    const notes = [];
    if (!menu) return { recs:[], explanation:"There's no menu loaded for this hall and date yet, so there's nothing to recommend from." };
    const inPeriod = (i, p) => p === "Any" || periodOf(i.station) === p || periodOf(i.station) === "All day";
    const allergies = (profile?.allergies || []).map(a => a.toLowerCase());
    const hard = (profile?.diet || []).filter(d => CONFIG.hardDiet.includes(d));
    let excludedAllergen = 0, excludedDiet = 0, noCal = 0;
    const pool = menu.items.filter(i => {
      if (CONDIMENT.test(i.station) || !inPeriod(i, period)) return false;
      if (!NutritionService.isNum(i.nutr.cal)) { noCal++; return false; }
      if (i.nutr.cal < 40) return false;
      if (allergies.length && i.allergens.some(a => allergies.some(u => a.toLowerCase().includes(u.split(" ")[0])))) { excludedAllergen++; return false; }
      if (hard.length && !hard.every(h => i.labels.some(l => l.toLowerCase().includes(h.toLowerCase())))) { excludedDiet++; return false; }
      return true;
    });
    if (excludedAllergen) notes.push(`${excludedAllergen} dish${excludedAllergen>1?"es":""} left out because Nutrislice lists one of your allergens.`);
    if (excludedDiet) notes.push(`${excludedDiet} dish${excludedDiet>1?"es":""} left out because they aren't labeled ${hard.join(" and ")}.`);
    if (noCal) notes.push(`${noCal} dish${noCal>1?"es":""} skipped because calories aren't listed.`);
    const mealTarget = NutritionService.isNum(targets?.cal) ? targets.cal/3 : null;
    const ceiling = mealTarget ? mealTarget*1.15 : 900, floor = mealTarget ? mealTarget*0.8 : 450;
    const strategies = [
      { title:"Protein-forward plate", score:i => NutritionService.isNum(i.nutr.protein) ? i.nutr.protein / Math.max(i.nutr.cal,40) : -1,
        why:"Starts with the dish that has the most protein per calorie, then adds items from other stations." },
      { title:"Fiber and variety", score:i => NutritionService.isNum(i.nutr.fiber) ? i.nutr.fiber*10 - i.nutr.cal/200 : -1,
        why:"Favors dishes with listed fiber and mixes stations for variety." },
      { title:"Lighter plate", score:i => -i.nutr.cal + (NutritionService.isNum(i.nutr.protein) ? i.nutr.protein*10 : 0),
        why:"Builds a smaller plate from lower-calorie dishes that still carry some protein." }
    ];
    const recs = [], usedAnchors = new Set(), sigs = new Set();
    for (const s of strategies) {
      const ranked = pool.filter(i => s.score(i) >= 0 || s.title === "Lighter plate").sort((a,b) => s.score(b) - s.score(a));
      const anchor = ranked.find(i => !usedAnchors.has(i.id) && i.nutr.cal >= 100 && i.nutr.cal <= ceiling && (s.title !== "Lighter plate" || (i.nutr.protein ?? 0) >= 8)); if (!anchor) continue;
      const ap = periodOf(anchor.station);
      const pick = [anchor]; let cal = anchor.nutr.cal; const stations = new Set([anchor.station]);
      for (const i of ranked) {
        if (pick.length >= 4 || cal >= floor) break;
        if (i.nutr.cal < 60 || pick.some(x => x.name.toLowerCase() === i.name.toLowerCase())) continue;
        if (ap !== "All day" && !inPeriod(i, ap)) continue;
        if (pick.some(x => x.id === i.id) || stations.has(i.station) && pool.length > 4) continue;
        if (cal + i.nutr.cal > ceiling) continue;
        pick.push(i); cal += i.nutr.cal; stations.add(i.station);
      }
      const sig = pick.map(i=>i.id).sort().join(","); if (sigs.has(sig)) continue;
      sigs.add(sig); usedAnchors.add(anchor.id);
      const items = pick.map(i => ({ ...i, servings:1 }));
      const n = NutritionService.calculateMealNutrition(items);
      const lim = [];
      if (!n.complete) lim.push("Some nutrients aren't listed for these dishes, so totals marked N/A are incomplete.");
      if (allergies.length && items.some(i => !i.allergenInfo)) lim.push("Allergen info isn't listed for some of these dishes. That doesn't mean they're allergen-free; check with dining staff.");
      recs.push({ title:s.title + (ap !== "All day" ? ` · ${ap.toLowerCase()}` : ""), why:s.why + (mealTarget ? ` Aims near a third of your daily estimate (${fmt(mealTarget)} kcal).` : " No daily estimate is set, so it keeps the plate to a typical meal size."), items, nutrition:n, limitations:lim });
    }
    let explanation = notes.join(" ");
    if (recs.length < 3) explanation = (explanation ? explanation + " " : "") + (recs.length ? `Only ${recs.length} distinct option${recs.length>1?"s":""} could be built from the dishes that passed your filters.` : "No combination could be built from the dishes that passed your filters.");
    return { recs, explanation };
  }
};

/* ---------------- DayPlanService: builds a full day (breakfast, lunch, dinner) toward the daily energy target ---------------- */
const DayPlanService = {
  eligible(menu, profile){
    const al = (profile?.allergies || []).map(a => a.toLowerCase()), hard = (profile?.diet || []).filter(d => CONFIG.hardDiet.includes(d));
    return menu.items.filter(i => !CONDIMENT.test(i.station) && NutritionService.isNum(i.nutr.cal) && i.nutr.cal >= 40 &&
      !(al.length && i.allergens.some(a => al.some(u => a.toLowerCase().includes(u.split(" ")[0])))) &&
      !(hard.length && !hard.every(h => i.labels.some(l => l.toLowerCase().includes(h.toLowerCase())))));
  },
  build({ menu, profile, targetCal, selected, favs, useFavs, seed=0 }){
    if (!menu) return { status:"nomenu", picks:{}, notes:[] };
    const isN = NutritionService.isNum, notes = [];
    const pool = this.eligible(menu, profile);
    let rnd = seed * 9301 + 49297; const jitter = () => seed ? ((rnd = (rnd * 9301 + 49297) % 233280) / 233280) * 0.6 : 0;
    const used = new Set(selected.map(i => i.foodId)), usedNames = new Set(selected.map(i => i.name.toLowerCase()));
    const selCal = selected.reduce((a,i) => a + (isN(i.nutr.cal) ? i.nutr.cal * i.servings : 0), 0);
    if (selected.some(i => !isN(i.nutr.cal))) notes.push("Some selected dishes have no calorie info, so they aren't counted in the total.");
    const favHits = useFavs ? pool.filter(i => favs[i.id]) : [];
    const score = i => (isN(i.nutr.protein) ? i.nutr.protein / Math.max(i.nutr.cal, 40) * 10 : 0) + (isN(i.nutr.fiber) ? i.nutr.fiber * 0.15 : 0) + (useFavs && favs[i.id] ? 100 : 0) + jitter();
    const inP = (i, p) => { const ip = periodOf(i.station); return p === "Breakfast" ? (ip === "Breakfast" || (ip === "All day" && /fruit|yogurt/i.test(i.station))) : (ip === p || ip === "All day"); };
    const picks = { Breakfast:[], Lunch:[], Dinner:[] };
    const hasTarget = isN(targetCal);
    const add = (p, f) => { picks[p].push({ food:f, servings:1 }); used.add(f.id); usedNames.add(f.name.toLowerCase()); };
    const pickedCal = () => PERIODS.reduce((a,p) => a + picks[p].reduce((b,x) => b + x.food.nutr.cal * x.servings, 0), 0);
    PERIODS.forEach(p => {
      const selP = selected.filter(i => i.period === p).reduce((a,i) => a + (isN(i.nutr.cal) ? i.nutr.cal * i.servings : 0), 0);
      const budget = hasTarget ? targetCal * CONFIG.dayShares[p] - selP : (selP ? 0 : 600);
      if (budget < 80) return;
      const cand = pool.filter(i => inP(i, p)).sort((a,b) => score(b) - score(a));
      const stations = new Set(); let run = 0;
      for (const f of cand) {
        if (picks[p].length >= 4 || run >= budget * 0.9) break;
        if (used.has(f.id) || usedNames.has(f.name.toLowerCase()) || stations.has(f.station) && cand.length > 6) continue;
        if (run + f.nutr.cal > budget + 40) continue;
        add(p, f); run += f.nutr.cal; stations.add(f.station);
      }
    });
    let total = selCal + pickedCal(), diff = hasTarget ? targetCal - total : null;
    if (hasTarget) {
      for (let iter = 0; iter < 80 && Math.abs(diff) > CONFIG.calTolerance; iter++) {
        let best = null;
        if (diff > 0) {
          PERIODS.forEach(p => picks[p].forEach(x => { if (x.servings < 3) { const g = Math.abs(diff - x.food.nutr.cal); if (!best || g < best.g) best = { g, fn:() => x.servings++ }; } }));
          PERIODS.forEach(p => pool.filter(i => inP(i, p) && !used.has(i.id) && !usedNames.has(i.name.toLowerCase())).forEach(f => { const g = Math.abs(diff - f.nutr.cal); if (!best || g < best.g) best = { g, fn:() => add(p, f) }; }));
        } else {
          PERIODS.forEach(p => picks[p].forEach((x, ix) => { const g = Math.abs(diff + x.food.nutr.cal); if (!best || g < best.g) best = { g, fn:() => { if (x.servings > 1) x.servings--; else { picks[p].splice(ix, 1); used.delete(x.food.id); usedNames.delete(x.food.name.toLowerCase()); } } }; }));
        }
        if (!best || best.g >= Math.abs(diff)) break;
        best.fn(); total = selCal + pickedCal(); diff = targetCal - total;
      }
    }
    const within = hasTarget && Math.abs(diff) <= CONFIG.calTolerance;
    if (hasTarget && !within) notes.push(diff > 0 ? "Not enough dishes on this menu fit your allergies and dietary labels to reach the target." : "The dishes you've already selected go over the daily target.");
    if (useFavs && favHits.length) notes.push(`${favHits.length} of your favourites are on this menu and were tried first.`);
    else if (useFavs && Object.keys(favs).length) notes.push("None of your favourites are on this menu.");
    const recItems = PERIODS.flatMap(p => picks[p].map(x => ({ ...x.food, servings:x.servings, period:p })));
    const recN = NutritionService.calculateMealNutrition(recItems);
    return { status: hasTarget ? (within ? "within" : "off") : "notarget", picks, total, target: hasTarget ? targetCal : null, diff, within, selCal, recN, notes };
  }
};

/* ---------------- Persistence: cloud db with device fallback ---------------- */
const Store = {
  db:null, user:null, assets:null, uid:null, name:"", canWrite:null, mode:"connecting", chains:{},
  async init(){
    const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, assets] = await Promise.all([use("db"), use("user"), use("assets")]);
    this.db = db; this.user = user; this.assets = assets;
    if (user) { try { this.uid = await user.id(); } catch {} try { const me = await user.me(); this.name = (me && me.name) || ""; } catch {} try { this.canWrite = await user.can("data.write"); } catch {} }
    this.mode = db ? "cloud" : "device";
    return this;
  },
  write(path, body){
    if (!this.db) return Promise.resolve();
    const prev = this.chains[path] || Promise.resolve();
    const next = prev.catch(()=>{}).then(() => this.db.doc(path).set(body));
    this.chains[path] = next; return next;
  },
  userDoc(name){ return this.uid ? `data/users/${this.uid}/${name}` : null; },
  async loadPrivate(name){
    const p = this.userDoc(name);
    if (this.db && p) { try { const s = await this.db.doc(p).get(); if (s.exists) return s.data(); return null; } catch { return lsGet("np."+name); } }
    return lsGet("np."+name);
  },
  async savePrivate(name, body){
    lsSet("np."+name, body);
    const p = this.userDoc(name); if (this.db && p) return this.write(p, body);
  },
  watch(coll, cb, onErr){
    if (!this.db) { cb((lsGet("np.c."+coll) || [])); return () => {}; }
    return this.db.collection(coll).onSnapshot(snap => cb(snap.docs.map(d => ({ _id:d.id, ...d.data() }))), e => { console.warn(coll, e); setCloud("warn", "Cloud sync paused"); if (onErr) onErr(e); });
  },
  async saveShared(coll, id, body){
    if (!this.db) { const arr = (lsGet("np.c."+coll) || []).filter(x => x._id !== id); arr.push({ _id:id, ...body }); lsSet("np.c."+coll, arr); return; }
    return this.write(`${coll}/${id}`, body);
  },
  async deleteShared(coll, id){
    if (!this.db) { lsSet("np.c."+coll, (lsGet("np.c."+coll) || []).filter(x => x._id !== id)); return; }
    return this.db.doc(`${coll}/${id}`).delete();
  }
};

}
const msText = () => S.labels.length ? (S.labels.length === 1 ? S.labels[0] : `${S.labels.length} dietary labels`) : "Any dietary label";
function filteredFoods(){
  const m = currentMenu(); if (!m) return [];

function paintFoodGrid(){
  const g = document.getElementById("food-grid"); if (!g) return;

VIEWS.planner = () => {
  const items = S.plan.items, n = NutritionService.calculateMealNutrition(items), t = targets();
  const others = items.filter(i => MealPlanService.availability(i, S) !== "confirmed");
  const hasT = k => { const v = t[k]; return v && typeof v === "object" ? NutritionService.isNum(v.max) : NutritionService.isNum(v); };
  const prog = (lbl, key, unit, big) => {
    const tgt = t[key], hi = tgt && typeof tgt === "object" ? tgt.max : tgt, lo = tgt && typeof tgt === "object" ? tgt.min : tgt;
    if (!NutritionService.isNum(hi)) return "";
    const val = n.totals[{energy:"cal",protein:"protein",carbs:"carbs",fat:"fat",fiber:"fiber"}[key] || key];
    const share = val === null ? null : val/hi*100, pct = share === null ? 0 : Math.min(100, share), lp = Math.min(100, lo/hi*100);
    const tgtTxt = (lo === hi ? fmt(hi) : `${fmt(lo)}–${fmt(hi)}`) + (t.src[{energy:"cal"}[key] || key] === "custom" ? " (yours)" : "");
    if (big) return `<div class="prog"><div class="big num">${share===null?`<span class="muted">N/A</span>`:`${fmt(share)}%`}</div><div class="t"><span>of daily energy</span><span class="num muted">${val===null?"N/A":fmt(val)} of ${tgtTxt} ${unit}</span></div><div class="bar" style="height:10px"><i style="width:${pct}%;background:var(--brand)"></i></div></div>`;
    return `<div class="prog"><div class="t"><span>${lbl}</span><span class="num muted">${val===null?"N/A":fmt(val)} of ${tgtTxt} ${unit}${share===null?"":` · ${fmt(share)}%`}</span></div><div class="bar">${lo!==hi?`<b style="left:${lp}%;right:0"></b>`:""}<i style="width:${pct}%"></i></div></div>`;
  };
  const cal = t.cal; t.energy = cal;
  const shareHtml = hasT("energy") || hasT("protein") ? `${prog("Energy","energy","kcal",true)}${prog("Protein","protein","g")}${prog("Carbohydrates","carbs","g")}${prog("Fat","fat","g")}${prog("Fiber","fiber","g")}` : "";
  const missingList = Object.entries(n.missing).filter(([k,v]) => v && ["cal","protein","carbs","fat","fiber"].includes(k)).map(([k,v]) => `${({cal:"calories",protein:"protein",carbs:"carbs",fat:"fat",fiber:"fiber"})[k]} (${v})`);
  const row = (lbl, k, unit) => `<div class="nrow"><span>${lbl}</span><span class="num">${n.totals[k]===null?`<span class="muted">N/A</span>`:fmt(n.totals[k])+" "+unit}</span></div>`;
  return `
  <div class="page-head"><div><h1>Meal planner</h1><p class="lead">Build a meal from the dining hall menu and see how it fits your day.</p></div>
    <div class="head-actions">${hallSeg()}${dateSelect("pl-date", S.hall)}</div></div>
  <div class="ctx"><span><b>Hall</b> ${esc(CONFIG.halls[S.hall].name)}</span><span><b>Date</b> ${esc(niceDate(S.date))}</span><span><b>Selected</b> <span class="num" data-plancount-text>${n.servings}</span></span><span data-savestate class="small muted"></span></div>
  ${others.length ? notice(`${others.length} dish${others.length>1?"es are":" is"} from a different hall or date than the one selected. They stay in your plan, marked below, but aren't confirmed for ${esc(CONFIG.halls[S.hall].short)} on ${esc(niceDate(S.date))}.`) : ""}
  <div class="planner">
    <section class="card" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px"><h2>Your selected dishes</h2><span class="count" ${items.length?"":"hidden"}>${n.servings}</span></div>

function calorieOverview(t, why){

const AgentService = {
  ctl:null,

      dailyTargets:{ source:t.source, status:t.est.status, kcal:t.cal, protein_g:t.protein, carbs_g:t.carbs, fat_g:t.fat, fiber_g:t.fiber },
      mealPlan:{ items:S.plan.items.map(i => ({ name:i.name, period:i.period, servings:i.servings, hall:i.hall, date:i.date, kcal_each:i.nutr.cal })), totals:n.totals },
      favourites:Object.values(S.favs).map(f => f.name),
      menus:{ west:compact(S.menus[menuKey("west",S.date)]), east:compact(S.menus[menuKey("east",S.date)]) } });
  },
  rules(){ return `You are Wolfie Butler, the meal planning agent for Stony Brook University students. The same agent also texts students over iMessage (via Photon), so write like a friendly, concise text: short paragraphs or a few bullets, no headings, under 140 words unless asked.
Rules:
- Use ONLY the dishes and numbers in the CONTEXT JSON. A null value or "N/A" means not listed: say so; never estimate or invent nutrition, dishes, hours or availability.
- Never suggest a dish whose allergens include one of the student's allergies. If allergens are "not listed", say allergen info isn't listed and they should ask dining staff.
- Respect Vegetarian/Vegan/Halal preferences using dish labels only.
- If dailyTargets.status is "restricted", don't give calorie targets or weight-change advice; suggest a doctor or registered dietitian.
- Never create weight-loss or weight-gain plans. Estimates only, not medical advice.
- When the student wants a dish added to their plan, call add_to_meal with its id and hall.

CONTEXT:
${this.context()}`; },
    // Wolfie Butler chat -> your iMessage agent (same brain, tools and data as iMessage).
  // Put your tunnel address here, no slash at the end.
  agentUrl: "http://localhost:8787",
  async send(text){

    const t = targets(), n = NutritionService.calculateMealNutrition(S.plan.items);
    const page = JSON.stringify({
      selected:{ hall:CONFIG.halls[S.hall].name, date:S.date },

/* ---------------- Shared profile: this page, the website chat and iMessage ----------------
   The Wolfie Butler agent keeps one saved profile per student and both channels read and write it. Every change is stamped
   with the time, and the newer copy wins. The phone number is never part of what is shared with the agent. */
const agentProfile = p => ({ name:p.name, age:p.age, sex:p.sex, weight:p.weight, weightUnit:p.weightUnit, height:p.height, heightUnit:p.heightUnit, activity:p.activity,
  diet:p.diet, allergies:p.allergies, targetWeight:p.targetWeight, timeframeWeeks:p.timeframeWeeks });
const profileSig = p => JSON.stringify(Object.values(agentProfile(p)).map(v => Array.isArray(v) ? v.join("|") : String(v ?? "")));

/* Applies the agent's copy (changed over chat, over iMessage, or elsewhere). A field the agent doesn't know yet arrives as null and leaves the page's own value alone. */
function applyAgentProfile(ch, stamp){
  const match = (tokens, options) => options.filter(o => tokens.some(t => new RegExp("\\b" + o.toLowerCase() + "s?\\b").test(String(t).toLowerCase().replace(/-/g, " "))));   // whole words: "shellfish" must not tick "Fish"
  const before = profileSig(S.profile || EMPTY_PROFILE);
  const p = { ...EMPTY_PROFILE, ...(S.profile || {}) };
  for (const k of ["name","age","sex","weight","weightUnit","height","heightUnit","activity","targetWeight","timeframeWeeks"]) if (ch[k] !== undefined && ch[k] !== null) p[k] = ch[k];
  if (Array.isArray(ch.diet)) p.diet = match(ch.diet, CONFIG.dietOptions);
  if (Array.isArray(ch.allergies)) p.allergies = match(ch.allergies, CONFIG.allergyOptions);
  if (stamp) p.updatedAt = stamp;
  const changed = profileSig(p) !== before;
  S.profile = p; S.draft = null;
  Store.savePrivate("profile", p).catch(() => toast("Couldn't save your profile to the cloud. It's kept on this device."));
  if (changed) { render(); toast("Profile updated from chat"); }
}

const AccountSync = {
  _key:null, busy:false, ready:false,
  /* A random secret that only this browser (or the student's private cloud space) holds. It is how the agent recognises the student. */
  key(){
    return this._key ||= (async () => {
      for (let i = 0; i < 60 && Store.mode === "connecting"; i++) await new Promise(r => setTimeout(r, 50));
      const saved = await Store.loadPrivate("agentkey");
      if (saved && /^[A-Za-z0-9_-]{32,128}$/.test(saved.key || "")) return saved.key;
      const b = crypto.getRandomValues(new Uint8Array(32)), key = btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      await Store.savePrivate("agentkey", { key, createdAt:new Date().toISOString() });
      return key;
    })();
  },
  async call(path, { method = "GET", body } = {}){

      const r = S.recipes.find(x => x._id === input.dataset.id); if (!r) return;
      const { _id, ...body } = r; await Store.saveShared("recipes", _id, { ...body, thumbId:id, updatedAt:new Date().toISOString() });
    }
    toast("Photo saved"); render();
  } catch(e) { toast(e?.code === "too_large" ? "That image is too large. Use one under 20 MB." : e?.code === "unsupported_type" ? "Use a PNG, JPEG or WebP image." : "The photo didn't upload. Try again."); }
}
/* Curated recipes ship in data/recipes.json under stable ids. Seeding only adds an id that is missing, so a restart or a second run never duplicates or overwrites anything.
   It runs for the local device store, or for someone with edit access to the cloud database (the rules keep everyone else from writing curated recipes). */
/* Curated recipes that were taken out of the catalogue. Seeding removes them from the shared `recipes` collection (never from anyone's own userRecipes) so copies saved earlier go too. */
const RETIRED_RECIPE_IDS = ["r-overnight-oats", "r-tofu-rice-bowl", "r-black-bean-quesadilla", "r-chickpea-salad", "r-egg-fried-rice", "r-yogurt-parfait"];
const RETIRED_RECIPE_TITLES = ["dorm overnight oats", "gochujang tofu rice bowl", "black bean and corn quesadilla", "lemon chickpea salad", "leftover egg fried rice", "greek yogurt parfait", "egg fried"];
async function seedRecipes(onChange){
  if (seedRecipes.done) return; seedRecipes.done = true;
  let allowed = Store.mode === "device";
  if (!allowed && Store.user) { try { allowed = !!(await Store.user.canEdit()); } catch {} }
  if (!allowed) return;
  let removed = 0;
  try {
    for (const r of S.recipes.filter(r => RETIRED_RECIPE_IDS.includes(r._id) || (!r.ownerId && RETIRED_RECIPE_TITLES.includes(String(r.title).trim().toLowerCase())))) { await Store.deleteShared("recipes", r._id); removed++; }
    if (removed && Store.mode === "device") onChange(lsGet("np.c.recipes") || []);
  } catch (e) { console.warn("[recipe-seed] cleanup skipped:", e.message); }
  try {
    const res = await fetch("data/recipes.json"); if (!res.ok) throw new Error("HTTP " + res.status);
    const have = new Set(S.recipes.map(r => r._id)); let added = 0;
    for (const r of await res.json()) { if (!r || !r.id || !r.title || have.has(r.id)) continue; const { id, ...body } = r; await Store.saveShared("recipes", id, body); have.add(id); added++; }
    if (added && Store.mode === "device") onChange(lsGet("np.c.recipes") || []);   // the cloud database announces its own changes
  } catch (e) { console.warn("[recipe-seed] skipped:", e.message); }
}
/* ---------------- Boot ---------------- */
function migratePlan(items){
  const out = [];
  items.filter(i => i && i.name && i.foodId).forEach(i => { const period = PERIODS.includes(i.period) ? i.period : (periodOf(i.station || "") !== "All day" ? periodOf(i.station || "") : "Lunch");
    const key = MealPlanService.key(i.hall, i.date, i.foodId, period); const ex = out.find(x => x.key === key); if (ex) ex.servings += i.servings; else out.push({ ...i, period, key }); });
  return out;
}
(async function boot(){
  const h = (location.hash || "").slice(1); if (VIEWS[h]) S.view = h;
  S.plan = lsGet("np.mealplan") || { items:[] }; if (!Array.isArray(S.plan.items)) S.plan = { items:[] }; S.plan.items = migratePlan(S.plan.items);
  S.favs = Object.fromEntries(((lsGet("np.favorites") || {}).items || []).filter(f => f && f.foodId).map(f => [f.foodId, f]));
  S.wbAnim = true; paintWidget();
  S.profile = lsGet("np.profile");
  paintNav(); render();
  await Store.init();
  setCloud(Store.mode === "cloud" ? "on" : "warn", Store.mode === "cloud" ? "Cloud sync on" : "Offline · saved on this device");
  try {
    const [prof, plan, favs] = await Promise.all([Store.loadPrivate("profile"), Store.loadPrivate("mealplan"), Store.loadPrivate("favorites")]);
    if (favs && Array.isArray(favs.items)) S.favs = Object.fromEntries(favs.items.filter(f => f && f.foodId).map(f => [f.foodId, f]));
    if (prof && typeof prof === "object") S.profile = { ...EMPTY_PROFILE, ...prof };
    AccountSync.sync();   // best effort: pick up changes made over iMessage, and share this profile with the agent
    if (plan && Array.isArray(plan.items)) { S.plan = { items: migratePlan(plan.items) }; if (plan.context && CONFIG.halls[plan.context.hall]) S.hall = plan.context.hall; }
  } catch {}
  Store.watch("menus", docs => { S.menus = {}; docs.forEach(d => { if (d && d.hall && d.date && Array.isArray(d.items)) S.menus[menuKey(d.hall,d.date)] = d; });
    if (!currentMenu()) { const ds = datesFor(S.hall); const pick = ds.find(d => d >= todayISO()) || ds.at(-1); if (pick && !S.menus[menuKey(S.hall,todayISO())]) S.date = pick; }
    if (!document.querySelector(".scrim") && !document.activeElement?.closest?.("form,#menu-q")) render(); else if (S.view === "menus") paintFoodGrid(); });
  Store.watch("site", docs => { S.site = docs.find(d => d._id === "config") || {}; if (S.view === "overview" && !document.querySelector(".scrim")) render(); if (!S.chatOpen) paintWidget(); });
  const redraw = () => { if (!document.querySelector(".scrim") && !document.activeElement?.closest?.("form")) render(); };
  const onRecipes = docs => { S.recipes = docs.filter(r => r && r.title).sort((a,b) => (a.order ?? 99) - (b.order ?? 99) || String(a.title).localeCompare(b.title));
    S.recLoaded.recipes = true; S.recErr.recipes = false; redraw(); };
  Store.watch("recipes", docs => { onRecipes(docs); seedRecipes(onRecipes); }, () => { S.recLoaded.recipes = true; S.recErr.recipes = true; redraw(); });
  Store.watch("userRecipes", docs => { S.userDocs = Object.fromEntries(docs.map(d => [d._id, Array.isArray(d.items) ? d.items : []]));
    rebuildCommunity(); S.recLoaded.community = true; S.recErr.community = false; redraw(); resolveNames(); }, () => { S.recLoaded.community = true; S.recErr.community = true; redraw(); });
  /* TEMP demo seed: outside Claude's preview there is no cloud db (Store.mode === "device"), so nothing ever fills `menus`.
     Load the bundled Nutrislice-parsed files in data/ once. Needs the site served over http(s); fetch() is blocked on file://. */
  if (Store.mode === "device") {
    console.info("[menu-diag] mode=device, location.protocol=" + location.protocol + ", date=" + todayISO());
    for (const hall of Object.keys(CONFIG.halls)) {
      const key = menuKey(hall, todayISO()); if (S.menus[key]) { console.info("[menu-diag] already stored:", key); continue; }
      const url = `data/${hall}--${todayISO()}.json`;
      try {
        const res = await fetch(url); console.info("[menu-diag] GET", url, "->", res.status);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const d = await res.json(); console.info("[menu-diag] keys:", Object.keys(d), "items:", Array.isArray(d.items) ? d.items.length : "n/a");
        if (!d || !Array.isArray(d.items)) throw new Error("unexpected structure");
        const doc = { ...d, importedAt:new Date().toISOString() }; S.menus[key] = doc; await Store.saveShared("menus", key, doc);
      } catch (e) { console.error("[menu-diag] failed to load", url, "-", e.message, location.protocol === "file:" ? "(file:// blocks fetch: serve the folder over http, e.g. `npx serve .`)" : ""); }
    }
  }
  paintNav(); render(); if (!document.querySelector("#wolfie .wb-panel.opening")) paintWidget(); else setTimeout(() => { if (S.chatOpen && !wbClosing) paintWidget(); }, 650);
})();
</script>
